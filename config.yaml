paths:
  raw_data:       data/raw/
  processed_data: data/processed/
  subsets:        data/subsets/
  results:        results/
  models:         results/models/

datasets:
  cic_ids2018:
    name: "CIC-IDS2018"
    label_column: "Label"
    encoding: "latin-1"           # raw files use latin-1, not utf-8
    separator: ","
  unsw_nb15:
    name: "UNSW-NB15"
    label_column: "label"
    encoding: "utf-8"
    separator: ","

sampling:
  subset_size: 300000             # rows per dataset after stratified sampling
  random_seed: 42
  test_split: 0.2

privacy:
  epsilon_values: [0.1, 0.5, 1.0, 2.0, 5.0, 10.0]
  default_epsilon: 1.0

models:
  n_estimators: 100
  max_depth: 10
  n_jobs: -1
